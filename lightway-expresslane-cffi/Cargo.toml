[package]
name = "lightway-expresslane-cffi"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
description = "C ABI for ExpressLane data-packet encrypt/decrypt primitives (lightway-expresslane)."
license = "AGPL-3.0-only"
repository = "https://github.com/expressvpn/lightway-cffi"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
undocumented_unsafe_blocks = "deny"

[dependencies]
# The monorepo crate, same git-dep pattern the root lightway-cffi package
# uses for lightway-core. No features: the wolfssl backend stays off, this
# shim ships ring.
lightway-expresslane = { git = "https://github.com/expressvpn/lightway", branch = "expresslane-crate" }
# Same AEAD backend the fork's own lightway-expresslane pinned; RingAead
# (src/ring_aead.rs) implements the monorepo crate's ExpresslaneAead over it.
ring = "0.17"
# ExpresslaneAead::seal/open return BytesMut; matches the version the root
# lightway-cffi package already depends on.
bytes = "1.6.0"
# Scrub the stack copy of raw key material after installing it into a session.
zeroize = "1"

[build-dependencies]
cbindgen = "0.29"
